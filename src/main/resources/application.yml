server:
  port: 8080

spring:
  application:
    name: java-backend-intern-assignment

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: abhi
    password: abhi
  
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false # suppressed
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.assignment.ledger: INFO
    org.springframework.orm.jpa: WARN
